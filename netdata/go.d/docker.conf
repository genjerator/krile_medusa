# Netdata go.d Docker collector.
# Reads container state/health through the read-only docker-socket-proxy (never
# the raw socket). Gives per-container running/paused/stopped counts and health.
# Per-container CPU/RAM come from the cgroups plugin, with names resolved via the
# same DOCKER_HOST proxy.
jobs:
  - name: local
    address: 'tcp://docker-socket-proxy:2375'
